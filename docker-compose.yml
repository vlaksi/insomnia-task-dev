version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: avalanche-db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: usdc_transactions
    ports:
      - "5433:5432"  # Use 5433 to avoid conflicts with local PostgreSQL
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: