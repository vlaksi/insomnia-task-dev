services:
  app:
    build: .
    container_name: avalanche-usdc-analyzer
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    env_file:
      - .env

  postgres:
    image: postgres:15-alpine
    container_name: avalanche-db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: usdc_transactions
    ports:
      - "5433:5432"  # Expose the default PostgreSQL port in production
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: